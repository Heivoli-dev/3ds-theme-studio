name: Build Mac & Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node test/core.test.js

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: dist/*.dmg
          - os: windows-latest
            script: dist:win
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Noms de fichiers stables
        if: runner.os == 'macOS'
        run: |
          mv dist/3DS-Theme-Studio-Mac-arm64.dmg dist/3DS-Theme-Studio-Mac-Apple-Silicon.dmg
          mv dist/3DS-Theme-Studio-Mac-x64.dmg dist/3DS-Theme-Studio-Mac-Intel.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: 3ds-theme-studio-${{ runner.os }}
          path: ${{ matrix.files }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
