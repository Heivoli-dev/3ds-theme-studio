name: Build Mac & Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node test/core.test.js

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: dist/*.dmg
          - os: windows-latest
            script: dist:win
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Vérifier la signature de l'app Mac
        if: runner.os == 'macOS'
        run: |
          for app in dist/mac*/*.app; do codesign --verify --deep --strict --verbose=2 "$app"; codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier"; done
      - name: Noms de fichiers stables
        if: runner.os == 'macOS'
        run: |
          mv dist/3DS-Theme-Studio-Mac-arm64.dmg dist/3DS-Theme-Studio-Mac-Apple-Silicon.dmg
          mv dist/3DS-Theme-Studio-Mac-x64.dmg dist/3DS-Theme-Studio-Mac-Intel.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: 3ds-theme-studio-${{ runner.os }}
          path: ${{ matrix.files }}

  release:
    # Publie (ou met à jour) la Release vX.Y.Z correspondant à la version de package.json
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: 3DS Theme Studio v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          make_latest: true
          body: |
            Créateur de thèmes 3DS pour Anemone3DS — © heivoli-network.fr

            | Système | Fichier |
            | --- | --- |
            | Windows (installateur) | 3DS-Theme-Studio-Windows-Setup.exe |
            | Windows (portable) | 3DS-Theme-Studio-Windows-Portable.exe |
            | Mac Apple Silicon (M1 et plus) | 3DS-Theme-Studio-Mac-Apple-Silicon.dmg |
            | Mac Intel | 3DS-Theme-Studio-Mac-Intel.dmg |

            **macOS** : au premier lancement, macOS bloque l'app (développeur non identifié).
            Ouvrez Réglages Système → Confidentialité et sécurité → « Ouvrir quand même ».
            Ou dans le Terminal : `xattr -cr "/Applications/3DS Theme Studio.app"`
